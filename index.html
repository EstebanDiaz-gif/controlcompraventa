<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de compras y ventas</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f7a55">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#14231d;--mut:#5d6f66;--line:#d5ded9;--buy:#b4541c;--sell:#0f7a55;--acc:#0f7a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#18231e;--ink:#e8f0ec;--mut:#95a89f;--line:#2b3b34;--buy:#f0955a;--sell:#4fd1a0;--acc:#4fd1a0}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#18231e;--ink:#e8f0ec;--mut:#95a89f;--line:#2b3b34;--buy:#f0955a;--sell:#4fd1a0;--acc:#4fd1a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:16px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:800;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font:600 14px inherit;font-family:inherit}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:none;color:var(--ink);font:800 15px inherit;font-family:inherit}
.seg .c.on{border-color:var(--buy);background:var(--buy);color:#fff}
.seg .v.on{border-color:var(--sell);background:var(--sell);color:#fff}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:800 16px inherit;font-family:inherit}
.tot{margin-top:10px;font-weight:600;color:var(--mut);font-size:14px}
.big{font-size:32px;font-weight:800;line-height:1.1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:13px;color:var(--mut)}.v{font-size:19px;font-weight:800}
.pos{color:var(--sell)}.neg{color:var(--buy)}
.it{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.it:first-child{border-top:0}
.it small{color:var(--mut);display:block}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 4px}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--mut);border-top:0;font-size:12px}
td:first-child,th:first-child{text-align:left}
#pr{display:none}
@media print{body.printing main>*:not(#pr){display:none!important}body.printing{background:#fff}body.printing #pr{display:block;color:#000;background:#fff;font-size:13px}#pr h2{margin:0 0 4px}#pr td,#pr th{text-align:left;padding:6px 4px;border-top:1px solid #bbb;color:#000}#pr td.r,#pr th.r{text-align:right}}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Compras y ventas</h1>
<section id="load" hidden><div class="empty">Cargando…</div></section>
<section id="auth" hidden><div class="card"><h1 style="margin-top:0">Entrá a tu cuenta</h1>
<div class="k">Usá el mismo email y contraseña en todos tus celulares para ver los mismos datos.</div>
<label>Email</label><input id="aem" type="email" inputmode="email" autocomplete="username">
<label>Contraseña</label><input id="apw" type="password" autocomplete="current-password">
<button class="go" id="alogin">Entrar</button>
<button class="go" id="areg" style="background:none;color:var(--ink);border:2px solid var(--line);margin-top:8px">Crear cuenta nueva</button>
<div class="tot" id="amsg"></div>
<button class="x" id="areset" style="font-size:14px;margin-top:8px;text-decoration:underline">Olvidé mi contraseña</button></div></section>
<div id="appui">
<div class="tabs" id="tabs">
<button data-t="add" class="on">Cargar</button><button data-t="res">Resumen</button><button data-t="hist">Historial</button><button data-t="stk">Stock</button></div>
<section id="add"></section><section id="res" hidden></section><section id="hist" hidden></section><section id="stk" hidden></section>
<div id="acct" class="k" style="text-align:center;margin-top:8px"></div></div>
<datalist id="prods"></datalist><div id="pr"></div>
</main>
<script>
var KEY='cv_movs',M=[],backend=null;
try{M=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){M=[]}
function save(){if(backend)return;try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var money=function(n){return '$'+Math.round(n).toLocaleString('es-AR')};
var key=function(s){return s.trim().toLowerCase()};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var type='c',month=today().slice(0,7);
var MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mlabel(m){var p=m.split('-');return MN[+p[1]-1]+' '+p[0]}
function avg(p){var q=0,t=0;M.forEach(function(x){if(x.t=='c'&&key(x.p)==p){q+=x.q;t+=x.q*x.u}});return q?t/q:0}
function stock(p){var s=0;M.forEach(function(x){if(key(x.p)==p)s+=x.t=='c'?x.q:-x.q});return s}
function names(){var o={};M.forEach(function(x){o[key(x.p)]=x.p});return o}

function fillList(){var dl='',n=names();for(var k in n)dl+='<option value="'+n[k].replace(/"/g,'&quot;')+'">';$('prods').innerHTML=dl}
function drawAdd(){
$('add').innerHTML='<div class="card"><div class="seg"><button class="c '+(type=='c'?'on':'')+'" data-y="c">Compré</button><button class="v '+(type=='v'?'on':'')+'" data-y="v">Vendí</button></div>'+
'<label>Producto</label><input id="p" list="prods" placeholder="Ej: zapatilla Nike Air" autocomplete="off">'+
'<div class="row"><div><label>Cantidad</label><input id="q" type="number" inputmode="numeric" min="1" placeholder="0"></div><div><label>Precio por unidad</label><input id="u" type="number" inputmode="decimal" min="0" placeholder="0"></div></div>'+
(type=='v'?'<label>Tipo de venta</label><select id="k"><option value="mayor">Por mayor</option><option value="menor">Por menor</option></select>':'')+
'<label>Fecha</label><input id="d" type="date" value="'+today()+'">'+
'<div class="tot" id="tot"></div><button class="go" id="ok">Guardar '+(type=='c'?'compra':'venta')+'</button></div>';
fillList();
function upd(){var q=+$('q').value,u=+$('u').value,p=key($('p').value),t='';
if(q&&u)t='Total: '+money(q*u);
if(type=='v'&&p&&stock(p)!==0||type=='v'&&p&&M.some(function(x){return key(x.p)==p}))t+=(t?' · ':'')+'En stock: '+stock(p);
$('tot').textContent=t}
['p','q','u'].forEach(function(i){$(i).oninput=upd});
$('ok').onclick=function(){
var p=$('p').value.trim(),q=+$('q').value,u=+$('u').value;
if(!p||!q||q<=0||isNaN(u)||$('u').value===''){alert('Completá producto, cantidad y precio.');return}
if(type=='v'&&q>stock(key(p))&&!confirm('Tenés '+stock(key(p))+' en stock y estás vendiendo '+q+'. ¿Guardar igual?'))return;
var mv={id:Date.now(),t:type,d:$('d').value||today(),p:p,q:q,u:u,k:type=='v'?$('k').value:''};M.push(mv);if(backend)backend.add(mv);
save();month=($('d').value||today()).slice(0,7);drawAdd();drawAll();
$('tot').textContent='Guardado ✓'};
}
document.addEventListener('click',function(e){var y=e.target.dataset&&e.target.dataset.y;if(y){type=y;drawAdd()}});

function months(){var o={};o[today().slice(0,7)]=1;M.forEach(function(x){o[x.d.slice(0,7)]=1});return Object.keys(o).sort().reverse()}
function drawRes(){
var buy=0,sell=0,cost=0,my=0,mm=0,units=0,ub=0;
M.forEach(function(x){if(x.d.slice(0,7)!=month)return;var t=x.q*x.u;
if(x.t=='c'){buy+=t;ub+=x.q}else{sell+=t;units+=x.q;cost+=x.q*avg(key(x.p));if(x.k=='mayor')my+=t;else mm+=t}});
var gain=sell-cost;
var opts=months().map(function(m){return '<option value="'+m+'"'+(m==month?' selected':'')+'>'+mlabel(m)+'</option>'}).join('');
$('res').innerHTML='<div class="card"><select id="ms">'+opts+'</select>'+
'<div style="margin-top:14px" class="k">Ganancia del mes</div><div class="big '+(gain>=0?'pos':'neg')+'">'+money(gain)+'</div>'+
'<div class="k" style="margin-top:4px">Vendido menos el costo de lo que vendiste</div></div>'+
'<div class="card"><div class="g"><div><div class="k">Gasté en compras</div><div class="v neg">'+money(buy)+'</div><div class="k">'+ub+' unidades</div></div>'+
'<div><div class="k">Vendí</div><div class="v pos">'+money(sell)+'</div><div class="k">'+units+' unidades</div></div>'+
'<div><div class="k">Por mayor</div><div class="v">'+money(my)+'</div></div>'+
'<div><div class="k">Por menor</div><div class="v">'+money(mm)+'</div></div></div></div>'+
'<button class="go" id="pdfb" style="margin-top:0;margin-bottom:12px">Descargar resumen en PDF</button>'+
'<div class="card"><div class="k">El costo se calcula con el precio promedio al que compraste cada producto.</div></div>';
$('ms').onchange=function(){month=this.value;drawRes()};
$('pdfb').onclick=function(){pdf({buy:buy,sell:sell,gain:gain,my:my,mm:mm,units:units,ub:ub})}}

function pdf(s){
var l=M.filter(function(x){return x.d.slice(0,7)==month}).sort(function(a,b){return a.d.localeCompare(b.d)||a.id-b.id});
var h='<h2>Resumen de '+mlabel(month)+'</h2><p>Ganancia del mes: <b>'+money(s.gain)+'</b></p>'+
'<table><tr><td>Compras ('+s.ub+' unidades)</td><td class="r">'+money(s.buy)+'</td></tr>'+
'<tr><td>Ventas ('+s.units+' unidades)</td><td class="r">'+money(s.sell)+'</td></tr>'+
'<tr><td>Ventas por mayor</td><td class="r">'+money(s.my)+'</td></tr>'+
'<tr><td>Ventas por menor</td><td class="r">'+money(s.mm)+'</td></tr></table>'+
'<h3>Movimientos</h3><table><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th></tr>';
l.forEach(function(x){h+='<tr><td>'+x.d.split('-').reverse().join('/')+'</td><td>'+(x.t=='c'?'Compra':'Venta'+(x.k?' ('+x.k+')':''))+'</td><td>'+x.p.replace(/</g,'&lt;')+'</td><td class="r">'+x.q+'</td><td class="r">'+money(x.u)+'</td><td class="r">'+money(x.q*x.u)+'</td></tr>'});
$('pr').innerHTML=h+'</table>';
var doc='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resumen '+mlabel(month)+'</title><style>body{font-family:sans-serif;padding:16px;color:#000}table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-top:1px solid #bbb;text-align:left}.r{text-align:right}</style></head><body>'+h+'</table></body></html>';
function fallback(){document.title='Resumen '+mlabel(month);document.body.classList.add('printing');window.onafterprint=function(){document.body.classList.remove('printing')};window.print()}
try{
if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(!d){fallback();return}d.save({filename:'resumen-'+month+'.html',data:doc}).catch(function(){})}).catch(fallback)}
else fallback()
}catch(e){fallback()}}

function drawHist(){
var l=M.filter(function(x){return x.d.slice(0,7)==month}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id});
var h='<div class="card"><select id="mh">'+months().map(function(m){return '<option value="'+m+'"'+(m==month?' selected':'')+'>'+mlabel(m)+'</option>'}).join('')+'</select>';
if(!l.length)h+='<div class="empty">Todavía no cargaste nada este mes.</div>';
l.forEach(function(x){h+='<div class="it"><div><b>'+x.p.replace(/</g,'&lt;')+'</b><small>'+x.d.split('-').reverse().join('/')+' · '+x.q+' × '+money(x.u)+(x.k?' · por '+x.k:'')+'</small></div><div style="text-align:right"><b class="'+(x.t=='c'?'neg':'pos')+'">'+(x.t=='c'?'−':'+')+money(x.q*x.u)+'</b><small>'+(x.t=='c'?'compra':'venta')+'</small></div><button class="x" data-del="'+x.id+'" aria-label="Borrar">×</button></div>'});
$('hist').innerHTML=h+'</div>';
$('mh').onchange=function(){month=this.value;drawAll()};
Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(confirm('¿Borrar este movimiento?')){M=M.filter(function(x){return x.id!=b.dataset.del});if(backend)backend.del(b.dataset.del);save();drawAll()}}})}

function drawStk(){
var n=names(),h='<div class="card tbl"><table><tr><th>Producto</th><th>Stock</th><th>Costo prom.</th><th>Valor</th></tr>',c=0;
Object.keys(n).sort().forEach(function(k){c++;var s=stock(k),a=avg(k);h+='<tr><td>'+n[k].replace(/</g,'&lt;')+'</td><td class="'+(s<0?'neg':'')+'">'+s+'</td><td>'+money(a)+'</td><td>'+money(Math.max(s,0)*a)+'</td></tr>'});
if(!c)h+='<tr><td colspan="4" class="empty">Cargá tu primera compra para ver el stock.</td></tr>';
$('stk').innerHTML=h+'</table></div>'}

function drawAll(){drawRes();drawHist();drawStk()}
$('tabs').onclick=function(e){var t=e.target.dataset.t;if(!t)return;
Array.prototype.forEach.call(this.children,function(b){b.classList.toggle('on',b.dataset.t==t)});
['add','res','hist','stk'].forEach(function(s){$(s).hidden=s!=t});
if(t=='add')drawAdd();else drawAll()};
var acctInfo=null;
function drawAcct(){var a=$('acct');if(!acctInfo){a.innerHTML='';return}
a.innerHTML=acctInfo.email.replace(/</g,'&lt;')+(navigator.onLine?'':' · sin conexión')+' · <button class="x" id="out" style="font-size:13px;text-decoration:underline">Cerrar sesión</button>';
$('out').onclick=acctInfo.out}
window.addEventListener('online',drawAcct);window.addEventListener('offline',drawAcct);
window.App={
gate:function(g){$('appui').hidden=g!='app';$('auth').hidden=g!='login';$('load').hidden=g!='loading'},
setBackend:function(b){backend=b},
setData:function(a){M=a;fillList();drawAll()},
setUser:function(email,out){acctInfo=email?{email:email,out:out}:null;drawAcct()}
};
drawAdd();drawAll();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';

if(String(firebaseConfig.apiKey).indexOf('PEGAR')!==0){
var G=function(i){return document.getElementById(i)};
window.App.gate('loading');
var app=initializeApp(firebaseConfig);
var auth=getAuth(app);
var db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
var uid=null,unsub=null,checked=false;
var ref=function(id){return doc(db,'users',uid,'movs',String(id))};

function say(t){G('amsg').textContent=t}
function fail(e){var c=(e&&e.code)||'';
say(/invalid-credential|wrong-password|user-not-found/.test(c)?'Email o contraseña incorrectos.':
/email-already/.test(c)?'Ese email ya tiene cuenta. Tocá Entrar.':
/weak-password/.test(c)?'La contraseña tiene que tener al menos 6 caracteres.':
/invalid-email|missing-email/.test(c)?'El email no es válido.':
/network/.test(c)?'Sin conexión. Conectate a internet para entrar.':
'No se pudo entrar. Probá de nuevo.')}
G('alogin').onclick=function(){say('');signInWithEmailAndPassword(auth,G('aem').value.trim(),G('apw').value).catch(fail)};
G('areg').onclick=function(){say('');createUserWithEmailAndPassword(auth,G('aem').value.trim(),G('apw').value).catch(fail)};
G('areset').onclick=function(){var m=G('aem').value.trim();if(!m){say('Escribí tu email arriba y volvé a tocar.');return}
sendPasswordResetEmail(auth,m).then(function(){say('Te mandamos un mail para cambiar la contraseña.')}).catch(fail)};

function migrate(){
if(checked)return;checked=true;
var loc=[];try{loc=JSON.parse(localStorage.getItem('cv_movs')||'[]')}catch(e){}
if(!loc.length||localStorage.getItem('cv_migrado'))return;
try{localStorage.setItem('cv_migrado','1')}catch(e){}
if(confirm('Encontré '+loc.length+' movimientos guardados solo en este celu. ¿Los subo a tu cuenta?'))
loc.forEach(function(x){setDoc(ref(x.id),x).catch(function(){})})}

onAuthStateChanged(auth,function(u){
if(unsub){unsub();unsub=null}
checked=false;
if(!u){uid=null;window.App.setBackend(null);window.App.setUser(null);window.App.setData([]);window.App.gate('login');return}
uid=u.uid;
window.App.setBackend({
add:function(x){setDoc(ref(x.id),x).catch(function(){})},
del:function(id){deleteDoc(ref(id)).catch(function(){})}});
window.App.setUser(u.email,function(){signOut(auth)});
unsub=onSnapshot(collection(db,'users',uid,'movs'),function(snap){
var a=[];snap.forEach(function(d){a.push(d.data())});
window.App.setData(a);window.App.gate('app');migrate()},
function(){window.App.gate('app')})});
}
</script>
</body></html>
