# Publica el servidor de pagos (worker/) en Cloudflare cada vez que cambia.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN (obligatorio), CLOUDFLARE_ACCOUNT_ID (opcional: si falta, sale del token)
#   MP_CLIENT_ID, MP_CLIENT_SECRET               (de la aplicación de Mercado Pago; se pueden cargar después)
name: Servidor de pagos
on:
  push:
    branches: [main]
    paths: ['worker/**', 'pedido.js', 'promos.js', '.github/workflows/pagos.yml']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MP_CLIENT_ID: ${{ secrets.MP_CLIENT_ID }}
      MP_CLIENT_SECRET: ${{ secrets.MP_CLIENT_SECRET }}
    steps:
      - name: Faltan los datos de Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Cargá CLOUDFLARE_API_TOKEN en los secretos del repositorio."
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: 20
      - name: Publicar
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: worker
        run: |
          set -e
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          npm i --no-save --no-audit --no-fund wrangler@4 > /dev/null
          buscar() { npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="pekeron_mp"||String(x.title).endsWith("-pekeron_mp"));console.log(n?n.id:"")}catch(e){console.log("")}})'; }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx wrangler kv namespace create pekeron_mp; ID=$(buscar); fi
          if [ -z "$ID" ]; then echo "::error::No pude crear el espacio de datos (KV) en Cloudflare. Revisá que el token tenga permiso de Workers KV."; exit 1; fi
          sed "s/__KV_ID__/$ID/" wrangler.toml.tpl > wrangler.toml
          npx wrangler deploy | tee /tmp/deploy.txt
          if [ -n "$MP_CLIENT_ID" ] && [ -n "$MP_CLIENT_SECRET" ]; then
            node -e 'require("fs").writeFileSync("/tmp/s.json",JSON.stringify({MP_CLIENT_ID:process.env.MP_CLIENT_ID,MP_CLIENT_SECRET:process.env.MP_CLIENT_SECRET}))'
            npx wrangler secret bulk /tmp/s.json
            rm -f /tmp/s.json
          else
            echo "::notice::Todavía no cargaste MP_CLIENT_ID y MP_CLIENT_SECRET (la aplicación de Mercado Pago)."
          fi
          grep -o 'https://[a-z0-9.-]*workers.dev' /tmp/deploy.txt | head -1 | sed 's/^/::notice::Dirección del servidor: /'
