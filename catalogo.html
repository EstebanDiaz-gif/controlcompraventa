<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
:root{--b:#111;--bi:#fff;--bg:#f6f6f4;--card:#fff;--ink:#16161a;--mut:#6b6c72;--line:#e4e4e0;--ok:#0a7d4f;--r:16px}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.logo.ph{display:flex;align-items:center;justify-content:center;background:var(--b);color:var(--bi);font-weight:800;font-size:20px}
.brand h1{margin:0;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox{position:relative;flex:0 1 380px}
.sbox input{width:100%;padding:11px 14px 11px 40px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.cartb{position:relative;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cartb svg{width:24px;height:24px}
.cartb i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--b);color:var(--bi);font-size:12px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media(max-width:640px){.top .in{flex-wrap:wrap}.sbox{order:3;flex:1 0 100%}}
.hero{max-width:1200px;margin:0 auto;padding:14px 16px 0}
.hero .box{background:var(--b);color:var(--bi);border-radius:20px;padding:20px 22px}
.hero .box b{font-size:22px;letter-spacing:-.01em}.hero .box div{opacity:.88;margin-top:4px;font-size:15px}
.info{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:14px;font-weight:600}
.info a{color:inherit}.info span::before{content:"";}
.tools{max-width:1200px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:12px;border:0;background:var(--b);color:var(--bi);font-weight:700}
.cnt{color:var(--mut);font-size:14px}
.sel{padding:9px 12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.vt{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.vt button{border:0;background:transparent;color:var(--ink);padding:8px 12px;display:flex}
.vt button.on{background:var(--b);color:var(--bi)}.vt svg{width:18px;height:18px}
main{max-width:1200px;margin:0 auto;padding:10px 16px 130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px)}
.im{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--line)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;bottom:8px;background:#fff;color:#111;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tag.m{left:auto;right:8px;background:var(--ok);color:#fff}
.nm{margin-top:10px;font-size:15px;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pr{font-size:19px;font-weight:800}
.plus{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:20px;height:20px}
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row;gap:14px;align-items:center}
.grid.list .im{width:110px;flex:none}
.grid.list .body{flex:1;min-width:0}.grid.list .nm{margin-top:0;min-height:0}
.empty{color:var(--mut);text-align:center;padding:50px 0;grid-column:1/-1}
.wa-f{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:#1faa59;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
.wa-f svg{width:30px;height:30px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:3}
.bar button,.wa{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border-radius:14px;border:0;background:var(--b);color:var(--bi);font-weight:800;font-size:16px;text-align:center;text-decoration:none}
.wa{background:#1faa59;color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:6}
@media(min-width:760px){.sheet{align-items:center}.sheet>div{border-radius:22px!important}}
.sheet>div{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.cl{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:20px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.2);z-index:2}
.big{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--line);margin-bottom:12px}
.big img{width:100%;height:100%;object-fit:cover}
.dn{font-size:20px;font-weight:800}.dp{font-size:24px;font-weight:800;margin:4px 0}
.may{font-size:14px;color:var(--ok);font-weight:700;margin-bottom:6px}
.lbl{font-weight:700;margin:14px 0 6px;font-size:14px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700}
.chip.on{background:var(--b);color:var(--bi);border-color:var(--b)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px}
.q{display:flex;align-items:center;gap:4px}
.q button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:20px;font-weight:800}
.q span{min-width:32px;text-align:center;font-weight:800}
.add{flex:1;padding:13px;border-radius:12px;border:0;background:var(--b);color:var(--bi);font-weight:800}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ln img,.ln .t{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.ln .d{flex:1;min-width:0}.ln small{display:block;color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:14px 0}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}.hint{color:var(--ok);font-weight:700}
.x{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 16px 20px}
</style></head><body>
<header class="top"><div class="in">
<div class="brand"><div id="lg" class="logo ph">·</div><h1 id="ttl">Catálogo</h1></div>
<div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" type="search" placeholder="Buscar producto o talle" autocomplete="off"></div>
<button class="cartb" id="cb" aria-label="Ver pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.4 9.1a2 2 0 0 1-2 1.7H8.4a2 2 0 0 1-2-1.7L5 9Z"/><path d="M9 9l3-5 3 5"/></svg><i id="cbn" hidden>0</i></button>
</div></header>
<div id="hero" class="hero" hidden><div class="box"><b id="hb"></b><div id="hs"></div></div></div>
<div id="inf" class="info" hidden></div>
<div class="tools"><div class="tl"><button class="pill" id="all">Ver todos</button><span class="cnt" id="cnt"></span></div>
<div class="tl"><select class="sel" id="ord"><option value="az">Ordenar: A-Z</option><option value="menor">Menor precio</option><option value="mayor">Mayor precio</option></select>
<div class="vt"><button id="vg" class="on" aria-label="Cuadrícula"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button><button id="vl" aria-label="Lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button></div></div></div>
<main><div class="grid" id="grid"><div class="empty">Cargando…</div></div></main>
<footer id="ft"></footer>
<a class="wa-f" id="waf" hidden target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.300-4.400A9 9 0 1 1 21 12Z"/><path d="M9 8.500c0 3.500 3 6.500 6.500 6.500l1-1.800-2-1-1 .8c-1-.4-1.800-1.200-2.200-2.200l.8-1-1-2L9 8.500Z" fill="currentColor" stroke="none"/></svg></a>
<div class="bar" id="bar" hidden><button id="vc"></button></div>
<div class="sheet" id="sh" hidden><div id="shc"></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,doc,getDoc,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
var $=function(i){return document.getElementById(i)};
var sid=(new URLSearchParams(location.search).get('t')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
var db,INFO=null,G=[],CART=[],SEL={},Q='',ORD='az',VIEW='grid',OPEN='';
var key=function(s){return String(s||'').trim().toLowerCase()};
var money=function(n){return '$'+Math.round(n).toLocaleString('es-AR')};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sizeSort(a,b){var x=parseFloat(a),y=parseFloat(b);if(!isNaN(x)&&!isNaN(y)&&x!=y)return x-y;return String(a).localeCompare(String(b),undefined,{numeric:true})}
function fail(m){$('grid').innerHTML='<div class="empty">'+esc(m)+'</div>'}
function goodColor(c){return /^#[0-9a-f]{6}$/i.test(c||'')}
function lum(c){var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);return (r*299+g*587+b*114)/1000}
function theme(){var c=goodColor(INFO.color)?INFO.color:'#111111';document.documentElement.style.setProperty('--b',c);document.documentElement.style.setProperty('--bi',lum(c)>150?'#111':'#fff')}
function head(){var n=INFO.name||'Catálogo';$('ttl').textContent=n;document.title=n;
var lg=$('lg');if(INFO.logo&&/^data:image\//.test(INFO.logo)){lg.outerHTML='<img id="lg" class="logo" alt="" src="'+esc(INFO.logo)+'">';var ic=document.querySelector('link[rel=icon]')||document.head.appendChild(document.createElement('link'));ic.rel='icon';ic.href=INFO.logo}else{lg.textContent=(n[0]||'C').toUpperCase()}
if(INFO.tag){$('hero').hidden=false;$('hb').textContent=INFO.tag;var s=[];if(INFO.mode=='carrito'&&INFO.minCart>0)s.push('Llevando '+INFO.minCart+' o más prendas accedés a precio mayorista.');$('hs').textContent=s.join(' ');if(!s.length)$('hs').hidden=true}
var i=[];if(INFO.hours)i.push('<span>🕒 '+esc(INFO.hours)+'</span>');if(INFO.addr)i.push('<span>📍 '+esc(INFO.addr)+'</span>');
if(INFO.ig){var u=String(INFO.ig).replace(/^@/,'').replace(/[^\w.]/g,'');if(u)i.push('<a target="_blank" rel="noopener" href="https://instagram.com/'+esc(u)+'">📷 @'+esc(u)+'</a>')}
if(i.length){$('inf').hidden=false;$('inf').innerHTML=i.join('')}
if(INFO.wa){$('waf').hidden=false;$('waf').href='https://wa.me/'+String(INFO.wa).replace(/\D/g,'')+'?text='+encodeURIComponent('Hola! Vi tu catálogo y quería consultar.')}
$('ft').textContent=n}
if(!sid){fail('Falta el código de la tienda en el link.')}
else{db=getFirestore(initializeApp(firebaseConfig));
getDoc(doc(db,'stores',sid,'public','info')).then(function(s){
if(!s.exists()||!s.data().enabled){fail('Este catálogo no está disponible.');return}
INFO=s.data();theme();head();
return getDocs(collection(db,'stores',sid,'stock')).then(function(sn){
var m={};sn.forEach(function(d){var x=d.data(),k=key(x.s||x.n);var g=m[k]||(m[k]={k:k,n:x.n||'',s:x.s||'',pm:0,pn:0,mm:0,img:'',oh:false,sz:[],q:0});
g.n=x.n||g.n;if(x.pm)g.pm=x.pm;if(x.pn)g.pn=x.pn;if(x.mm)g.mm=x.mm;if(x.img)g.img=x.img;if(x.oh)g.oh=true;
g.q+=Math.max(x.q||0,0);if(x.z&&(x.q||0)>0)g.sz.push({z:x.z,q:x.q})});
G=Object.keys(m).map(function(k){return m[k]}).filter(function(g){return !g.oh&&g.q>0&&(g.pn||g.pm)});
G.forEach(function(g){g.sz.sort(function(a,b){return sizeSort(a.z,b.z)})});draw()})}).catch(function(){fail('No pude cargar el catálogo. Probá de nuevo.')})}
function inCart(g,z){var r=0;CART.forEach(function(l){if(l.k==g.k&&(z===undefined||l.z==z))r+=l.q});return r}
function stockOf(g,z){if(!g.sz.length)return g.q;var f=g.sz.filter(function(s){return s.z==z})[0];return f?f.q:0}
function base(g){return g.pn||g.pm}
function mayTxt(g){if(!(g.pm&&g.pn&&g.pm<g.pn))return '';if(INFO.mode=='carrito'){return INFO.minCart>0?'Mayorista '+money(g.pm)+' llevando '+INFO.minCart+' o más en total':''}
return g.mm>0?'Mayorista '+money(g.pm)+' desde '+g.mm+' unidades':''}
var PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function draw(){
var t=key(Q).split(/\s+/).filter(Boolean);
var l=G.filter(function(g){var h=key(g.n+' '+g.s+' '+g.sz.map(function(s){return s.z+' t'+s.z}).join(' '));return t.every(function(w){return h.indexOf(w)>=0})});
l.sort(function(a,b){return ORD=='menor'?base(a)-base(b):ORD=='mayor'?base(b)-base(a):a.n.localeCompare(b.n)});
$('cnt').textContent=G.length?l.length+' producto'+(l.length==1?'':'s'):'';
$('grid').className='grid'+(VIEW=='list'?' list':'');
if(!l.length){$('grid').innerHTML='<div class="empty">'+(G.length?'No encontré productos con esa búsqueda.':'Por ahora no hay productos disponibles.')+'</div>';bar();return}
$('grid').innerHTML=l.map(function(g){var mt=g.pm&&g.pn&&g.pm<g.pn&&(INFO.mode=='carrito'?INFO.minCart>0:g.mm>0);
return '<div class="card" data-k="'+esc(g.k)+'"><div class="im">'+(g.img?'<img loading="lazy" alt="" src="'+esc(g.img)+'">':'')+(g.q<=2?'<span class="tag">Últimas unidades</span>':'')+(mt?'<span class="tag m">Mayorista</span>':'')+'</div><div class="body"><div class="nm">'+esc(g.n)+'</div><div class="pb"><span class="pr">'+money(base(g))+'</span><span class="plus">'+PLUS+'</span></div></div></div>'}).join('');bar()}
function prod(k){var g=G.filter(function(x){return x.k==k})[0];if(!g)return;OPEN=k;
var s=SEL[k]||(SEL[k]={z:g.sz.length==1?g.sz[0].z:'',q:1}),mt=mayTxt(g);
$('shc').innerHTML='<button class="cl" data-cl="1" aria-label="Cerrar">×</button><div class="big">'+(g.img?'<img alt="" src="'+esc(g.img)+'">':'')+'</div><div class="dn">'+esc(g.n)+'</div><div class="dp">'+money(base(g))+'</div>'+(mt?'<div class="may">'+esc(mt)+'</div>':'')+
(g.sz.length?'<div class="lbl">Elegí una opción</div><div class="chips">'+g.sz.map(function(z){return '<button class="chip'+(s.z==z.z?' on':'')+'" data-z="'+esc(z.z)+'">'+esc(z.z)+'</button>'}).join('')+'</div>':'')+
'<div class="row"><div class="q"><button data-m="-1">−</button><span>'+s.q+'</span><button data-m="1">+</button></div><button class="add" data-add="1">Agregar al pedido</button></div>';
$('sh').hidden=false}
/* precios: modo 'producto' o 'carrito' */
function price(g,tot){var may=false;
if(g.pm&&(g.pn||g.pm)){if(INFO.mode=='carrito')may=INFO.minCart>0&&tot>=INFO.minCart;else may=g.mm>0&&inCart(g)>=g.mm}
return may?g.pm:(g.pn||g.pm)}
function lines(){var tot=CART.reduce(function(a,l){return a+l.q},0);
return {tot:tot,ls:CART.map(function(l){var g=G.filter(function(x){return x.k==l.k})[0],u=g?price(g,tot):0;return {g:g,l:l,u:u,may:!!(g&&g.pm&&u==g.pm&&g.pn&&g.pm<g.pn)}})}}
function bar(){var n=CART.reduce(function(a,l){return a+l.q},0);$('bar').hidden=!n;$('cbn').hidden=!n;$('cbn').textContent=n;if(n){var r=lines(),t=r.ls.reduce(function(a,x){return a+x.u*x.l.q},0);$('vc').textContent='Ver pedido ('+n+') · '+money(t)}}
function hint(r){if(INFO.mode=='carrito'&&INFO.minCart>0){var f=INFO.minCart-r.tot;return f>0?'Sumá '+f+' prenda'+(f==1?'':'s')+' más y todo pasa a precio mayorista.':'Precio mayorista aplicado a todo el pedido.'}
return ''}
function sheet(){OPEN='';var r=lines();
if(!r.ls.length){$('sh').hidden=true;return}
var total=r.ls.reduce(function(a,x){return a+x.u*x.l.q},0),h='<button class="cl" data-cl="1" aria-label="Cerrar">×</button><b style="font-size:20px">Tu pedido</b>';
r.ls.forEach(function(x,i){h+='<div class="ln">'+(x.g.img?'<img alt="" src="'+esc(x.g.img)+'">':'<div class="t"></div>')+'<div class="d"><b>'+esc(x.g.n)+'</b><small>'+(x.l.z?'Talle '+esc(x.l.z)+' · ':'')+x.l.q+' × '+money(x.u)+(x.may?' (mayorista)':'')+'</small></div><div style="text-align:right"><b>'+money(x.u*x.l.q)+'</b><br><button class="x" data-del="'+i+'">Quitar</button></div></div>'});
var hn=hint(r);
h+='<div class="tot"><span>Total</span><span>'+money(total)+'</span></div>'+(hn?'<div class="note hint">'+esc(hn)+'</div>':'')+
'<div class="note">El stock no se reserva. El negocio te confirma disponibilidad, pago y envío por WhatsApp.</div>'+
(INFO.wa?'<a class="wa" id="wal" target="_blank" rel="noopener" href="'+esc(waLink(r,total))+'">Enviar pedido por WhatsApp</a>':'<div class="note">Este negocio todavía no cargó su WhatsApp.</div>')+
'<button class="x" data-cl="1" style="display:block;margin:14px auto 0">Seguir mirando</button>';
$('shc').innerHTML=h;$('sh').hidden=false}
function waLink(r,total){var m='Hola! Quiero hacer este pedido:\n';
r.ls.forEach(function(x){m+='- '+x.l.q+' × '+x.g.n+(x.l.z?', talle '+x.l.z:'')+' — '+money(x.u)+(x.l.q>1?' c/u':'')+(x.may?' (mayorista)':'')+'\n'});
m+='Total: '+money(total);return 'https://wa.me/'+String(INFO.wa).replace(/\D/g,'')+'?text='+encodeURIComponent(m)}
$('sq').oninput=function(){Q=this.value;draw()};
$('all').onclick=function(){Q='';$('sq').value='';ORD='az';$('ord').value='az';draw()};
$('ord').onchange=function(){ORD=this.value;draw()};
$('vg').onclick=function(){VIEW='grid';$('vg').className='on';$('vl').className='';draw()};
$('vl').onclick=function(){VIEW='list';$('vl').className='on';$('vg').className='';draw()};
$('vc').onclick=sheet;$('cb').onclick=function(){if(CART.length)sheet();else alert('Tu pedido está vacío. Tocá un producto para agregarlo.')};
$('grid').onclick=function(e){var c=e.target.closest('.card');if(c)prod(c.dataset.k)};
$('sh').onclick=function(e){var d=e.target.dataset||{};
if(e.target==$('sh')||d.cl){$('sh').hidden=true;OPEN='';return}
if(d.del!==undefined){CART.splice(+d.del,1);bar();sheet();return}
if(!OPEN)return;var k=OPEN,g=G.filter(function(x){return x.k==k})[0],s=SEL[k];
if(d.z!==undefined){s.z=d.z;s.q=1;prod(k);return}
if(d.m){var mx=g.sz.length?stockOf(g,s.z)-inCart(g,s.z):g.q-inCart(g);s.q=Math.max(1,Math.min(s.q+ +d.m,Math.max(mx,1)));prod(k);return}
if(d.add){if(g.sz.length&&!s.z){alert('Elegí un talle.');return}
var mx2=(g.sz.length?stockOf(g,s.z):g.q)-inCart(g,g.sz.length?s.z:undefined);
if(mx2<=0){alert('Ya agregaste todo el stock disponible de este producto.');return}
var q=Math.min(s.q,mx2),ex=CART.filter(function(l){return l.k==k&&l.z==(g.sz.length?s.z:'')})[0];
if(ex)ex.q+=q;else CART.push({k:k,z:g.sz.length?s.z:'',q:q});s.q=1;$('sh').hidden=true;OPEN='';bar()}};
</script></body></html>
