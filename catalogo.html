<title>Catálogo</title><meta property="og:type" content="website"><meta property="og:title" content="Catálogo online · Pedí por WhatsApp"><meta property="og:description" content="Mirá los productos con fotos y precios, armá tu pedido y envialo por WhatsApp."><meta property="og:image" content="https://pekeronapp.com/icon-512.png"><meta name="description" content="Mirá los productos con fotos y precios, armá tu pedido y envialo por WhatsApp.">
<style>
:root{--b:#111;--bi:#fff;--bg:#fff;--card:#fff;--soft:#f1f1ef;--ink:#16171c;--mut:#73757c;--line:#ebebe8;--ok:#1a8f4c;--wa:#3156E8;--r:22px}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;cursor:pointer;color:inherit}
html{overflow-anchor:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ib i,.cartc i{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--b);color:var(--bi);font-size:11px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.ib.fav.on svg{fill:#e0245e;stroke:#e0245e}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none;border:2px solid rgba(255,255,255,.9)}
.logo.ph{display:flex;align-items:center;justify-content:center;background:var(--b);color:var(--bi);font-weight:800;font-size:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1,.brand b{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{min-width:0}
/* barra compacta que aparece al bajar */
.hdr{position:fixed;top:0;left:0;right:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .25s}
.hdr.on{transform:none}
.hdr .in{max-width:var(--mw);margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.hdr .logo{width:36px;height:36px;border:0}.hdr .ib{width:38px;height:38px;box-shadow:none;background:var(--soft)}
/* portada */
.hero{position:relative;max-width:var(--mw);margin:0 auto;overflow:hidden;background:var(--b);color:var(--bi)}
.hero.ph{height:min(64vh,560px);min-height:400px;background:#ddd}
.hero.pl{min-height:0}
@media(min-width:900px){.hero{border-radius:0 0 28px 28px}}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 50%,rgba(0,0,0,.5) 100%)}
.hero.pl .hshade{display:none}
.htop{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:16px 16px 0}
.hero.ph .htop{color:#fff}
.hic{display:flex;gap:8px}
.htag{position:absolute;z-index:1;left:20px;right:20px;bottom:24px;font-size:clamp(24px,6.5vw,38px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
.hero.ph .htag{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.hero.dst .htag{bottom:150px}
.hero.pl .htag{position:relative;left:auto;right:auto;bottom:auto;padding:18px 20px 26px}
.hero.pl.dst .htag{padding-bottom:150px}
.hero.pl.dst{min-height:300px}
/* En el celular, con destacados: portada más baja y la rueda un poco más arriba, para que se vea entera */
.hero.ph.dst{height:min(54vh,480px);min-height:340px}
.hero.pl:not(.dst) .htop{padding-bottom:16px}
/* Con foto de portada y destacados: la frase va como etiqueta chica (vidrio esmerilado) debajo del nombre,
   así la foto de portada se ve entera */
.hero.ph.dst .htag{top:82px;bottom:auto;right:auto;max-width:calc(100% - 40px);box-sizing:border-box;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.36);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:760px){.hero.ph.dst .htag{font-size:15px;padding:9px 18px}}
/* destacados (carrusel que se monta sobre la portada) */
.dest{position:relative;z-index:2;max-width:var(--mw);margin:-128px auto 0;--cw:min(64vw,300px)}
/* En el celular, con foto de portada: portada más alta y destacados un poco más chicos, para que la foto se vea */
@media(max-width:759px){.hero.ph.dst{height:max(54vh,380px);min-height:0}.hero.ph.dst+.dest{margin-top:-120px;--cw:min(56vw,260px)}}
.dest h2{display:none}
/* Rueda de destacados: el del medio adelante y nítido, los de los costados más chicos, girados y desenfocados */
.ring{position:relative;height:calc(var(--cw) * 1.38 + 16px);perspective:1100px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rc{position:absolute;left:50%;top:6px;width:var(--cw);height:calc(var(--cw) * 1.38);margin-left:calc(var(--cw) / -2);border-radius:26px;overflow:hidden;background:var(--soft);box-shadow:0 18px 44px rgba(0,0,0,.28);cursor:pointer;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s,opacity .6s;will-change:transform}
.rc>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.rc .ph0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;color:#c9c9c4}
.rc .badge{left:12px;top:12px}
.rc .inf{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.96);color:#111;border-radius:18px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.rc .inf .tx{flex:1;min-width:0}
.rc .inf b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .inf span{font-size:15px;font-weight:800}
.rc .inf s{font-size:12px;color:#888;margin-left:6px;font-weight:600}
.rc .vb{flex:none;background:var(--b);color:var(--bi);border-radius:12px;padding:10px 16px;font-weight:800;font-size:14px}
.rn{position:absolute;top:calc((var(--cw) * 1.38 + 16px) / 2);transform:translateY(-50%);z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font-size:26px;font-weight:700;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.rn.l{left:8px}.rn.r{right:8px}
.rdots{display:flex;justify-content:center;gap:6px;padding:8px 0 4px;flex-wrap:wrap}
.rdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.rdots i.on{width:20px;border-radius:5px;background:var(--ink)}
.drow{display:flex;gap:14px;overflow-x:auto;padding:0 16px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}.drow::-webkit-scrollbar{display:none}
.dc{flex:none;width:min(66vw,270px);scroll-snap-align:start;background:var(--card);border-radius:var(--r);padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);cursor:pointer;display:flex;flex-direction:column}
.dc .im{border-radius:16px}
.dc .nm{min-height:0;-webkit-line-clamp:1;margin-top:10px;font-size:17px;font-weight:600}
.dc .pb{margin-top:auto;padding-top:6px}
.dc .go{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dc .go svg{width:16px;height:16px}
.badge{position:absolute;left:8px;top:8px;background:#111;color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:5px 9px;z-index:1}
/* tarjetas de información */
.info{max-width:var(--mw);margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:8px}
.info span,.info a{background:var(--soft);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none}
.sec{max-width:var(--mw);margin:0 auto;padding:22px 16px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sec h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.cnt{color:var(--mut);font-size:13.5px;font-weight:600;white-space:nowrap}
.tools{max-width:var(--mw);margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sbox{position:relative;flex:1 1 260px}
.sbox input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);font:inherit;outline:none}
.sbox input:focus{box-shadow:0 0 0 2px var(--ink)}
.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.tr{display:flex;align-items:center;gap:8px}
.pill{padding:9px 14px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);font-weight:700;font-size:14px}
.sel{padding:9px 10px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:14px;font-weight:700}
.vt{display:flex;border-radius:12px;overflow:hidden;background:var(--soft)}
.vt button{border:0;background:transparent;color:var(--mut);padding:8px 11px;display:flex}
.vt button.on{background:var(--ink);color:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;max-width:var(--mw);margin:0 auto;padding:8px 16px 4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--soft);color:var(--ink);border-radius:99px;padding:9px 15px;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:#fff}
main{max-width:var(--mw);margin:0 auto;padding:12px 16px 170px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{background:var(--card);border-radius:var(--r);display:flex;flex-direction:column;cursor:pointer;min-width:0}
.im{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--soft)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .ph0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#c9c9c4}
.tag{position:absolute;left:8px;bottom:8px;background:#fff;color:#111;font-size:11.5px;font-weight:800;border-radius:8px;padding:4px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tag.m{left:auto;right:8px;background:var(--b);color:var(--bi)}
.off{position:absolute;left:8px;top:8px;background:var(--b);color:var(--bi);font-size:12px;font-weight:900;border-radius:8px;padding:4px 8px}
.hf{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.hf svg{width:18px;height:18px}.hf.on svg{fill:#e0245e;stroke:#e0245e}
.body{padding:10px 4px 2px;display:flex;flex-direction:column;flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds{color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.card .pr{display:flex;flex-direction:column-reverse;line-height:1.15}.card .pr s{margin:0 0 1px;font-size:12.5px}
.pr{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr s{font-size:13px;font-weight:500;color:var(--mut);margin-left:6px}
.kg{font-size:.7em;font-weight:700;opacity:.75}
.plus{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:18px;height:18px}
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row;gap:14px;align-items:center}
.grid.list .im{width:104px;flex:none}
.grid.list .body{padding:0}.grid.list .nm{min-height:0}
.empty{color:var(--mut);text-align:center;padding:50px 0;grid-column:1/-1}
/* ---------- Catálogo de almacén / kiosco / drugstore (estilo supermercado) ---------- */
body.alm{--ap:#0E4D45;--al:#C8EE6E;--ad:#0E2E29;--abg:#F3F5F1;--c1:#FBE7C4;--c2:#E2F2D5;--c3:#FFE0E0;--c4:#DCEBFA;background:var(--abg)}
body.alm #hero,body.alm #dest,body.alm #cats,body.alm #inf,body.alm .tools .sbox,body.alm .tools .vt{display:none!important}
.ah{max-width:var(--mw);margin:0 auto}
.ahb{background:var(--ap);color:#fff;padding:14px 16px 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.ahb::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
@media(min-width:760px){.ahb{padding:18px 28px 32px;border-radius:0 0 34px 34px}}
.aht{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.aht .lg{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ap);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex:none;overflow:hidden}
.aht .lg img{width:100%;height:100%;object-fit:cover}
.aht .nm{flex:1;min-width:0}.aht b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aht small{display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aht .ai{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none}
.aht .ai .ic{width:22px;height:22px}
.aht .ai em{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:99px;background:var(--al);color:var(--ad);font-size:11px;font-weight:900;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ahs{display:flex;align-items:center;gap:10px;background:#fff;color:#111;border-radius:16px;padding:0 14px;height:50px;margin-top:14px;position:relative;z-index:1}
.ahs .ic{width:20px;height:20px;color:#777;flex:none}
.ahs input{border:0;flex:1;min-width:0;font:inherit;font-size:16px;outline:none;background:none;color:#111}
.ahban{display:flex;align-items:center;gap:14px;margin-top:18px;position:relative;z-index:1}
.ahban .tx{flex:1;min-width:0}
.ahban h2{font-size:clamp(22px,6.2vw,36px);line-height:1.06;margin:0;letter-spacing:-.025em}
.ahban p{margin:8px 0 14px;opacity:.85;font-size:14px;line-height:1.35}
.ahban .go{display:inline-block;background:var(--al);color:var(--ad);border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.ahban .pi{width:40%;max-width:330px;aspect-ratio:1/1;border-radius:22px;overflow:hidden;flex:none;background:rgba(255,255,255,.08)}
.ahban .pi img{width:100%;height:100%;object-fit:cover;display:block}
.acats{display:flex;gap:10px;overflow-x:auto;padding:16px 14px 4px;scrollbar-width:none}
/* En la compu: historias y categorías centradas (y en varias filas si no entran) */
@media(min-width:760px){.acats,.ast{flex-wrap:wrap;justify-content:center;overflow:visible;max-width:var(--mw);margin-left:auto;margin-right:auto;column-gap:18px}}
.acats::-webkit-scrollbar{display:none}
.acat{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:12.5px;font-weight:700;color:var(--ad);width:76px;cursor:pointer;text-align:center;line-height:1.15}
.acat i{width:62px;height:62px;border-radius:50%;background:var(--c1);display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;box-shadow:0 3px 10px rgba(0,0,0,.07);transition:transform .2s,background .2s}
.acat:nth-child(4n+2) i{background:var(--c2)}.acat:nth-child(4n+3) i{background:var(--c3)}.acat:nth-child(4n) i{background:var(--c4)}
.acat.on i{background:var(--al);transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.acat.on{color:var(--ap)}
.ahd{display:flex;justify-content:space-between;align-items:baseline;max-width:var(--mw);margin:0 auto;padding:18px 16px 8px}
.ahd h3{margin:0;font-size:20px;color:var(--ad);letter-spacing:-.01em}
.adest{max-width:var(--mw);margin:0 auto}
.arow{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.arow::-webkit-scrollbar{display:none}
.arow .ac{flex:none;width:158px;scroll-snap-align:start}
body.alm .sec h2{color:var(--ad)}
@media(min-width:760px){.ahban .pi{width:250px}.ahban h2{font-size:38px}}
html body.alm .hdr{background:var(--ap);border-bottom:0;color:#fff}
html body.alm .hdr b{color:#fff}
html body.alm .hdr .ib{background:rgba(255,255,255,.14);color:#fff}

body.alm .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px}
@media(min-width:760px){body.alm .grid{grid-template-columns:repeat(4,minmax(0,1fr))}.arow .ac{width:190px}}
@media(min-width:1000px){body.alm .grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ac{background:#fff;border-radius:20px;padding:10px 10px 12px;display:flex;flex-direction:column;text-align:center;box-shadow:0 2px 12px rgba(14,46,41,.06);position:relative;cursor:pointer;min-width:0}
.ac .aim{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;background:#fff}
.ac .aim img{width:100%;height:100%;object-fit:contain}
.ac .aim .ph0{font-size:46px;font-weight:800;color:#d5dbd2}
.ac .anm{font-weight:700;font-size:14.5px;line-height:1.22;margin-top:8px;color:var(--ad);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.44em}
.ac .asub{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .apr{font-size:22px;font-weight:900;color:var(--ad);margin-top:6px;letter-spacing:-.02em;line-height:1.1}
.ac .apr .kg{font-size:12px;font-weight:700;color:var(--mut)}
.ac .apr s{display:block;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:0}
.ac .aadd{margin-top:auto;padding-top:10px}
.ac .add{width:100%;height:40px;border-radius:12px;border:0;background:#EEF1EA;font-size:26px;font-weight:500;color:var(--ad);cursor:pointer;line-height:1}
.ac .stp{display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:12px;background:var(--al);padding:0 5px}
.ac .stp button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ad);background:none;color:var(--ad);font-size:18px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

body.est-celus .im,body.est-celus .rc{border-radius:14px}
body[class*="est-"] .chip.on,body[class*="est-"] .plus{background:var(--b);color:var(--bi)}
body.est-calzado .sec h2,body.est-celus .sec h2{text-transform:uppercase;letter-spacing:.04em;font-size:18px;font-weight:900}
/* ---------- Medios de pago ---------- */
.pprice+.pdt{text-align:center;font-size:14px}
.pdt{display:block;font-size:12.5px;color:var(--ok);font-weight:700;margin-top:3px;line-height:1.25}
.ac .pdt{margin-top:2px}
.pays{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pays label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-weight:700;cursor:pointer;background:var(--card)}
.pays label.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pays input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.pays .pi{font-size:20px;flex:none}.pays .pn{flex:1;min-width:0}
.pays .pb2{flex:none;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:#E6F4EA;color:#17713c}
.pays .pb2.rcg{background:#EEF0F3;color:#3b4048}
.dsc span:last-child{white-space:nowrap;flex:none}
.pdet{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14.5px}
.pdet .pr2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.pdet .pr2 span{min-width:0;word-break:break-all}.pdet .pr2 small{display:block;color:var(--mut);font-size:12px;font-weight:600;word-break:normal}
.pdet .cpb{flex:none;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;cursor:pointer}
.pdet .lk{display:block;text-align:center;text-decoration:none;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:12px;margin-top:6px}
.pdet p{margin:6px 0 0;color:var(--mut);font-size:13px;line-height:1.35}
/* ---------- Pie de página ---------- */
footer{position:relative;z-index:1;margin-top:34px;background:#141414;color:#d9d9d6;font-size:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.fseas{position:relative;overflow:hidden;padding:18px 20px;display:flex;align-items:center;gap:14px}
.fseas .em{font-size:38px;line-height:1;flex:none}
.fseas b{display:block;font-size:20px;font-family:Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:-.01em}
.fseas small{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:2px}
.fseas .cd{margin-left:auto;flex:none;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.fin{max-width:var(--mw);margin:0 auto;padding:24px 20px 10px;display:grid;grid-template-columns:1.25fr 1fr;gap:22px 18px}
.fin .fbr{grid-column:1/-1}
.fin .fcat{grid-column:1/-1}
.fcat .fl{display:flex;flex-wrap:wrap;gap:8px}
.fcat .fl button{display:inline-block;padding:7px 12px;border-radius:99px;background:#232323;font-size:13px}
@media(min-width:760px){.fin{grid-template-columns:1.4fr 1fr 1fr 1fr}.fin .fbr,.fin .fcat{grid-column:auto}.fcat .fl{display:block}.fcat .fl button{display:flex;background:none;padding:5px 0;font-size:14px}}
.fcol a,.fcol span{word-break:break-word}
.fbr{display:flex;gap:12px;align-items:center}
.fbr .logo,.fbr img{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.fbr b{display:block;color:#fff;font-size:18px}
.fbr small{display:block;color:#a3a39f;font-size:13px;margin-top:2px}
.fcol h4{margin:0 0 10px;color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.fcol a,.fcol button,.fcol span{display:flex;gap:8px;align-items:center;color:#d9d9d6;text-decoration:none;background:none;border:0;padding:5px 0;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.fcol a:hover,.fcol button:hover{color:#fff}
.fbot{max-width:var(--mw);margin:0 auto;padding:16px 20px 0;border-top:1px solid #2a2a2a;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;color:#8b8b87;font-size:12.5px}
.fbot a{color:#d9d9d6;text-decoration:none;font-weight:700}
.fbot a:hover{text-decoration:underline}
/* ---------- Efectos de la fecha especial: se mueven con el scroll, por detrás de los productos ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx i{position:absolute;left:0;top:0;font-style:normal;line-height:1;will-change:transform;opacity:.9;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
#fx .th{position:absolute;top:0;width:1px;background:rgba(120,120,120,.5)}
main,.sec,.tools,.cats,.info,.promos,#carta{position:relative;z-index:1}
/* barra inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
@media(min-width:620px){.bnav{border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0}}
.bnav>button,.bnav>a{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;text-decoration:none;min-width:58px;padding:4px 0 0;position:relative}
.bnav>.on{color:var(--ink)}
.bnav>.on::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:2px;background:var(--ink)}
.bnav .ic{width:22px;height:22px}
.cartc{width:58px!important;min-width:0!important;height:58px;border-radius:50%!important;background:var(--ink)!important;color:#fff!important;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 20px rgba(0,0,0,.25);padding:0!important;border:4px solid var(--card)!important}
.cartc .ic{width:24px;height:24px}
.vpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:4}
.vpill button{border:0;border-radius:99px;background:var(--b);color:var(--bi);font-weight:800;font-size:15px;padding:12px 20px;box-shadow:0 8px 22px rgba(0,0,0,.22);white-space:nowrap}
/* hojas (pedido, promo) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:6}
@media(min-width:760px){.sheet{align-items:center}.sheet>div{border-radius:26px!important}}
.sheet>div{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.cl{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;font-size:20px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.2);z-index:2}
/* ficha de producto (pantalla completa en el celular) */
.sheet.full{background:rgba(0,0,0,.45)}
.sheet.full>div{padding:0;max-height:100vh;height:100%;border-radius:0;background:var(--card)}
@media(min-width:760px){.sheet.full>div{height:auto;max-height:94vh;overflow:auto}}
.pimg{position:relative;background:var(--soft);aspect-ratio:1/1;max-height:58vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.pimg img{width:100%;height:100%;object-fit:contain;transition:filter .25s}.pimg img.lo{filter:blur(1.5px)}
.pimg .ph0{font-size:72px;font-weight:800;color:#c9c9c4}
.pimg.noi{aspect-ratio:auto;height:96px;cursor:default}
/* galería: varias fotos del producto, se pasan deslizando */
.gal{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal .sl{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.gal .sl img{width:100%;height:100%;object-fit:contain}
.gal .sl .ld{width:38px;height:38px;border-radius:50%;border:4px solid rgba(0,0,0,.12);border-top-color:rgba(0,0,0,.45);animation:gsp 1s linear infinite}
@keyframes gsp{to{transform:rotate(360deg)}}
.gdots{position:absolute;left:14px;bottom:34px;display:flex;justify-content:center;gap:7px;pointer-events:none;background:rgba(255,255,255,.8);padding:7px 10px;border-radius:99px}
.gdots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.25);transition:all .2s}
.gdots i.on{background:var(--ink);width:22px;border-radius:5px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:22px;font-weight:700;color:#111;cursor:pointer;display:none}
@media(hover:hover){.gnav{display:block}}
.gnav.l{left:10px}.gnav.r{right:10px}
.nfo{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;pointer-events:none}
.ptop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;z-index:2}
.ptop span{display:flex;gap:10px}
.zm{position:absolute;right:12px;bottom:34px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;pointer-events:none}
.pbody{position:relative;margin-top:-22px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.pbody h2{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;color:var(--mut);font-weight:600;text-align:left}
.pmeta .pcat{display:flex;align-items:center;gap:6px}
.stk{background:#dcf5e5;color:#13723b;font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap}
.stk.low{background:#ffe7d1;color:#a24a0b}
.pprice{display:flex;justify-content:center;align-items:baseline;gap:14px;margin:14px 0 2px;flex-wrap:wrap}
.pprice b{font-size:26px;font-weight:800}
.pprice s{font-size:20px;color:var(--mut);font-weight:500}
.pprice em{font-style:normal;background:var(--b);color:var(--bi);font-size:13px;font-weight:900;padding:3px 8px;border-radius:8px;align-self:center}
.may{font-size:14px;color:var(--ink);font-weight:700;margin-top:6px}
.pdesc{color:var(--mut);font-size:15px;margin:10px auto 0;max-width:440px;line-height:1.45}
.lbl{font-weight:700;margin:18px 0 8px;font-size:14px;color:var(--mut)}
.rad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ro{display:flex;align-items:center;gap:7px;border:0;background:var(--soft);border-radius:10px;padding:9px 13px;font-weight:600}
.ro i{width:16px;height:16px;border-radius:50%;border:2px solid #9a9ba1;flex:none;background:#fff}
.ro.on{background:#e7ecff;color:#123}.ro.on i{border:5px solid #2f6bff}
.qrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.opg{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}
.oph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;background:var(--soft)}.oph b{font-size:15px}.oph span{font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}.oph span.ob{background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px}
.opr{display:flex;align-items:center;gap:11px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:15px;font-weight:600;padding:12px 14px;text-align:left;cursor:pointer}
.opr span{flex:1}.opr em{font-style:normal;font-weight:800;font-size:14px}
.opr i{width:20px;height:20px;border-radius:6px;border:2px solid #9a9ba1;flex:none;background:#fff;display:flex;align-items:center;justify-content:center}.opr.r1 i{border-radius:50%}
.opr.on i{background:#2f6bff;border-color:#2f6bff}.opr.on i:after{content:'';width:6px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}.opr.r1.on i{background:#fff;border:6px solid #2f6bff}.opr.r1.on i:after{display:none}
.aadd{position:relative}.opq{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#e11d48;color:#fff;font-size:11.5px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;pointer-events:none}
.q{display:flex;align-items:center;gap:6px}
.q button{width:32px;height:32px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.q span{min-width:44px;text-align:center;font-weight:700;font-size:16px}
.acts{display:flex;gap:10px;margin-top:20px}
.add,.wa1{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 12px;border-radius:99px;border:0;font-weight:700;font-size:16px;text-decoration:none}
.add{background:var(--ink);color:#fff}
.wa1{background:var(--wa);color:#fff}
.dn{font-size:20px;font-weight:800}.dp{font-size:24px;font-weight:800;margin:4px 0}
.big{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#fff;margin-bottom:12px}
.big img{width:100%;height:100%;object-fit:contain}
.lb{position:fixed;inset:0;z-index:9;background:#000;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:10px;align-items:center;margin-top:16px}
.wa{display:block;width:100%;margin:0 auto;padding:15px;border-radius:99px;border:0;background:var(--wa);color:#fff;font-weight:800;font-size:16px;text-align:center;text-decoration:none}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ln img,.ln .t{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none}
.ln .d{flex:1;min-width:0}.ln small{display:block;color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:14px 0}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}.hint{color:var(--ink);font-weight:700}
/* carta de servicios y reserva de turnos */
.svl{max-width:var(--mw);margin:0 auto;padding:6px 16px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 24px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.svc b{font-size:16.5px;font-weight:700}.svc .k{color:var(--mut);font-size:13.5px;font-weight:600;margin-top:2px;display:block}
.svc p{margin:4px 0 0;color:var(--mut);font-size:14px;line-height:1.35}
.svc .sr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}.svc .sr b{font-size:17px;font-weight:800}
.rsv{border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;white-space:nowrap}
.rsv.alt{background:var(--soft);color:var(--ink)}
.bksv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0 4px}
.bksv span{color:var(--mut);font-size:14px;font-weight:600;white-space:nowrap}
.drow2{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.drow2::-webkit-scrollbar{display:none}
.dch{flex:none;border:0;background:var(--soft);border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;min-width:64px;line-height:1.15}
.dch small{font-weight:600;font-size:12px;color:var(--mut)}.dch.on{background:var(--ink);color:#fff}.dch.on small{color:#ddd}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tch{border:0;background:var(--soft);border-radius:12px;padding:11px 0;font-weight:700;font-size:15px}.tch.on{background:var(--ink);color:#fff}
.bkin{width:100%;padding:13px 14px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);font:inherit;margin-top:8px;outline:none}
.bkin:focus{box-shadow:0 0 0 2px var(--ink)}
.okc{width:64px;height:64px;border-radius:50%;background:#1a8f4c;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:10px auto 12px}
/* tema de temporada */
html[data-tema] .hdr{background:rgba(255,255,255,.96)}
.promos{max-width:var(--mw);margin:0 auto;padding:18px 0 0}
.promos h2{font-size:19px;margin:0 16px 10px;letter-spacing:-.01em}
.prow{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.prow::-webkit-scrollbar{display:none}
.pc{flex:none;width:min(78vw,300px);scroll-snap-align:start;background:var(--card);border:2px solid var(--b);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pc .pi{position:relative;aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.pc .pi img{width:100%;height:100%;object-fit:cover}.pc .pi.two img{width:50%}
.pc .pt{position:absolute;left:10px;top:10px;background:var(--b);color:var(--bi);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.pc .po{position:absolute;right:10px;top:10px;background:#FFD6AA;color:#102468;font-size:13px;font-weight:900;padding:4px 9px;border-radius:99px}
.pc .pb2{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .pn{font-weight:800;font-size:17px;line-height:1.2}.pc .pd{color:var(--mut);font-size:13px;line-height:1.3}
.pc .pp{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}.pc .pp b{font-size:20px}.pc .pp s{color:var(--mut);font-size:14px}
.pq{flex:none;width:min(70vw,260px);scroll-snap-align:start;border-radius:var(--r);padding:16px;background:var(--b);color:var(--bi);display:flex;flex-direction:column;justify-content:center}
.pq b{font-size:26px;line-height:1.05;letter-spacing:-.01em}.pq span{font-size:14px;opacity:.9;margin-top:6px;font-weight:600}
.pinc{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.dsc{display:flex;justify-content:space-between;color:var(--ink);font-weight:800;margin-top:10px}
.tmb{max-width:var(--mw);margin:0 auto;padding:26px 16px 6px}
.tmb .box{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px}
.tmb small{display:inline-block;background:rgba(255,255,255,.75);color:#222;border-radius:99px;padding:4px 11px;font-weight:800;font-size:12px;letter-spacing:.02em}
.tmb b{display:block;font-size:clamp(24px,6vw,34px);line-height:1.05;margin:10px 0 6px;letter-spacing:-.02em;font-family:Georgia,"Times New Roman",serif;font-style:italic}
.tmb span.t{display:block;font-size:15px;font-weight:600;max-width:70%}.tmb .cd{display:inline-block;margin-top:10px;border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px}
.tmb .fl{position:absolute;pointer-events:none}
.tmb .in{position:relative;z-index:1;max-width:76%}

   Sin esto, "atrás" con un producto abierto cerraba el catálogo. Ahora cierra la foto ampliada o la
   ventana abierta (producto, pedido, turno), después vuelve al inicio del catálogo, y recién ahí sale.
